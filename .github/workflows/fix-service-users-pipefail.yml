name: Fix service user detection pipefail

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-service-users-pipefail.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 scripts/fix-service-users-pipefail.py
      - run: bash -n install.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git commit -m "Fix fresh install service detection under pipefail"
          git push origin main
