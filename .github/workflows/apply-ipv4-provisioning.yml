name: Apply IPv4 provisioning update

on:
  push:
    branches: [main]
    paths:
      - scripts/add-ipv4-provisioning.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply network provisioning update
        run: python3 scripts/add-ipv4-provisioning.py
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Commit installer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git commit -m "Add host-supplied IPv4 provisioning" || exit 0
          git push origin main
