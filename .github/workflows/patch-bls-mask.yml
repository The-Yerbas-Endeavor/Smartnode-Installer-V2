name: Apply BLS key masking patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-bls-mask.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch BLS private key prompt
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('install.sh')
          s = p.read_text()

          old = '    read -r -s -p "BLS private key for $user (may be blank): " bls; echo\n'
          new = '''    while true; do
              read -r -s -p "BLS private key for $user: " bls
              echo

              [[ -n "$bls" ]] || {
                  echo "BLS private key is required."
                  continue
              }

              if (( ${#bls} >= 8 )); then
                  echo "BLS private key entered: ${bls:0:4}...${bls: -4}"
              else
                  echo "BLS private key is too short."
                  continue
              fi

              break
          done
'''

          if old not in s:
              raise SystemExit('Expected BLS private key prompt not found; no changes made.')

          p.write_text(s.replace(old, new, 1))
          PY

          bash -n install.sh

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-bls-mask.yml
          git add install.sh
          git commit -m "Require and mask BLS private key confirmation [skip ci]"
          git push origin main
