name: Fix resume unbound variable

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-resume-unbound.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply resume fix
        run: python3 scripts/fix-resume-unbound.py
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Commit installer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git commit -m "Fix unbound status variable in reboot resume" || exit 0
          git push origin main
