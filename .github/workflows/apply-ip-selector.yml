name: Apply IPv4 and IPv6 selector

on:
  push:
    paths:
      - .github/workflows/apply-ip-selector.yml
      - .github/scripts/apply-ip-selector.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch installer
        run: python3 .github/scripts/apply-ip-selector.py
      - name: Validate installer
        run: bash -n install.sh
      - name: Commit installer update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install.sh
          if git diff --cached --quiet; then
            echo "No installer changes required."
            exit 0
          fi
          git commit -m "Add selectable IPv4 and IPv6 address prompt"
          git push
