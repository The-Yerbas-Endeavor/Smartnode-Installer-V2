name: Apply public IP selection update

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-public-ip-menu.py
      - .github/workflows/apply-public-ip-menu.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply installer update
        run: python3 scripts/apply-public-ip-menu.py

      - name: Validate shell syntax
        run: bash -n install.sh

      - name: Commit installer update
        run: |
          if git diff --quiet -- install.sh; then
            echo "No installer changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git commit -m "List only public IP addresses"
          git push origin main
