name: Apply existing installation flow

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-existing-install-flow.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply installer and README updates
        run: python3 scripts/apply-existing-install-flow.py

      - name: Validate shell syntax
        run: bash -n install.sh

      - name: Commit updates
        run: |
          if git diff --quiet -- install.sh README.md; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh README.md
          git commit -m "Prompt to add users on existing installs"
          git push origin main
