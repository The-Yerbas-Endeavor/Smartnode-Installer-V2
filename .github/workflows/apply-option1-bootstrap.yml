name: Apply per-user bootstrap installation

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-option1-bootstrap.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply installer update
        run: python3 scripts/apply-option1-bootstrap.py

      - name: Validate shell syntax
        run: bash -n install.sh

      - name: Commit installer update
        run: |
          if git diff --quiet -- install.sh; then
            echo "No installer changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh
          git commit -m "Install bootstrap separately for each user"
          git push origin main
