name: ShellCheck

on:
  push:
    branches:
      - main
    paths:
      - "**/*.sh"
      - "bin/**"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - "bin/**"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck --version

      - name: Discover shell scripts
        id: scripts
        run: |
          mapfile -d '' files < <(
            find . -type f \
              \( -name '*.sh' -o -path './bin/*' \) \
              -not -path './.git/*' \
              -print0
          )

          if (( ${#files[@]} == 0 )); then
            echo "No shell scripts found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\0' "${files[@]}" > /tmp/shell-files
          printf 'Found %d shell script(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Run Bash syntax checks
        if: steps.scripts.outputs.found == 'true'
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < /tmp/shell-files

      - name: Run ShellCheck
        if: steps.scripts.outputs.found == 'true'
        run: |
          mapfile -d '' files < /tmp/shell-files
          shellcheck \
            --format=gcc \
            --severity=warning \
            --external-sources \
            --source-path=SCRIPTDIR \
            "${files[@]}"
