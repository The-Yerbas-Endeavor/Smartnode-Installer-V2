name: Patch IP menu v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-ip-menu-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch IP menu
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('install.sh')
          s = p.read_text()

          replacements = [
              ('local user="$1" choice manual default=1 i ip',
               'local user="$1" choice manual default=0 i ip'),
              ("} | awk 'NF && !seen[$0]++')\n\n    for ip in \"${public_v4[@]}\"; do choices+=(\"$ip\"); labels+=(\"Public IPv4\"); done",
               "} | awk 'NF && !seen[$0]++' | python3 -c 'import ipaddress,sys; print(\"\\n\".join(sorted((x.strip() for x in sys.stdin if x.strip()), key=ipaddress.ip_address)))')\n\n    for ip in \"${public_v4[@]}\"; do choices+=(\"$ip\"); labels+=(\"Public IPv4\"); done"),
              ("printf ' %2d) %-39s (%s)\\n' \"$((i + 1))\" \"${choices[$i]}\" \"${labels[$i]}\" >&2",
               "printf ' %2d) %-39s (%s)\\n' \"$i\" \"${choices[$i]}\" \"${labels[$i]}\" >&2"),
              ("printf ' %2d) Enter a different public IP manually\\n' \"$((${#choices[@]} + 1))\" >&2",
               "printf ' %2d) Enter a different public IP manually\\n' \"${#choices[@]}\" >&2"),
              ("if ((choice >= 1 && choice <= ${#choices[@]})); then\n            printf '%s\\n' \"${choices[$((choice - 1))]}\"",
               "if ((choice >= 0 && choice < ${#choices[@]})); then\n            printf '%s\\n' \"${choices[$choice]}\""),
              ("elif ((choice == ${#choices[@]} + 1)); then",
               "elif ((choice == ${#choices[@]})); then"),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit('Expected installer text not found: ' + old[:80])
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          bash -n install.sh

      - name: Commit patch and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/patch-ip-menu-v2.yml
          rm -f .github/workflows/patch-ip-order.yml .github/workflows/apply-ip-menu-order.yml
          git add -A
          git commit -m "Sort Smartnode IP menu ascending [skip ci]"
          git push origin main
